# DynamoDB Local, started by docker-compose.yml.
aws.dynamodb.endpoint=http://localhost:8000

# DynamoDB Local accepts any credentials, but the SDK refuses to build a client
# without a provider. DynamoDbConfig supplies dummy static credentials whenever
# an endpoint override is set, so nothing needs to be configured here.

app.bootstrap-tables=true

logging.level.org.adoyo.shortenurl=DEBUG
