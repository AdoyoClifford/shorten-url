spring.application.name=shortenurl

# Everything runs locally for v1 (docs/api-design.md 9).
spring.profiles.active=local

# --- AWS -------------------------------------------------------------------
# No endpoint here: unset means "real AWS", using the default credentials chain.
# The local profile overrides it to point at DynamoDB Local.
aws.region=us-east-1

# --- Application -----------------------------------------------------------
app.base-url=http://localhost:8080
app.code-length=7
app.code-alphabet=123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz
# Every link expires (docs/api-design.md 4). Absent expiry on create means this many days.
app.default-ttl-days=30
app.list-shards=10
app.max-code-attempts=3

# Creating tables from the app is a local-dev convenience. Deployed environments
# get their tables from IaC - an app that creates its own tables will eventually
# create the wrong one.
app.bootstrap-tables=false

app.tables.links=links
app.tables.clicks=clicks

app.analytics.flush-interval=2s
app.analytics.queue-capacity=10000

app.ratelimit.creates-per-minute=60

# --- Actuator --------------------------------------------------------------
# Health only. Keep in step with app.reserved-codes - anything exposed at the
# root competes with the /{code} redirect namespace.
management.endpoints.web.exposure.include=health

